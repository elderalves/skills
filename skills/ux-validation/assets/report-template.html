<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$section · UX validation</title>
    <style>
        :root {
            color-scheme: light;
            font: 16px/1.55 system-ui, sans-serif;
            color: #182224;
            background: #f5f6f4;
            --muted: #4d5b5b;
            --line: #dce3e0;
            --accent: #17634d;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        main { max-width: 58rem; margin: auto; padding: clamp(1rem, 4vw, 3.5rem); }
        header { padding-bottom: 1.35rem; border-bottom: 1px solid var(--line); }
        h1, h2, h3, h4, p, dl, figure { margin: 0; }
        h1 { font-size: clamp(2rem, 6vw, 3.9rem); letter-spacing: -.055em; line-height: 1.06; }
        h2 { font-size: 1.45rem; letter-spacing: -.025em; margin-bottom: .8rem; }
        h3 { font-size: 1.15rem; line-height: 1.35; letter-spacing: -.015em; }
        h4 { font-size: 1.05rem; line-height: 1.35; }
        p { overflow-wrap: anywhere; }
        .context, .viewport, dt, figcaption, .reviews span { color: var(--muted); }
        .context { font-size: .93rem; margin-bottom: .45rem; overflow-wrap: anywhere; }
        .scope { display: grid; gap: .5rem; margin-top: 1.1rem; }
        .scope div { display: flex; flex-wrap: wrap; gap: .15rem .65rem; }
        .scope dt { min-width: 5.25rem; }
        dd { margin: 0; overflow-wrap: anywhere; }
        nav { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; margin-top: 1rem; }
        a { color: var(--accent); text-underline-offset: .18em; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        main > section { margin-top: 1.7rem; }
        .card { background: #fff; border: 1px solid var(--line); border-radius: .8rem; padding: clamp(.9rem, 3vw, 1.35rem); }
        .card + .card { margin-top: .75rem; }
        .outcome { border-left: .3rem solid #6c7675; }
        .outcome.completed { border-left-color: #2b7a62; }
        .outcome.blocked { border-left-color: #b74235; }
        .outcome p, .step p { margin-top: .45rem; }
        .takeaway { margin-top: .85rem; }
        .finding-group + .finding-group { margin-top: 1.35rem; }
        .finding-group > h3 { margin-bottom: .55rem; }
        .tags { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .65rem; }
        .tags span { font-size: .78rem; font-weight: 650; border-radius: .3rem; padding: .1rem .45rem; }
        .priority.p0 { background: #fce8e6; color: #8a2b22; }
        .priority.p1 { background: #faecdf; color: #784422; }
        .priority.p2 { background: #f3efdd; color: #625019; }
        .priority.p3, .confidence.observed { background: #e8f0eb; color: #254e43; }
        .confidence.hypothesis { background: #eceaf4; color: #514277; }
        .finding dl { margin-top: .7rem; }
        .finding dt { font-size: .85rem; font-weight: 650; margin-top: .45rem; }
        .review-note, .evidence-links { font-size: .9rem; margin-top: .65rem; }
        .evidence-links a { display: inline-block; padding: .1rem .3rem; }
        .step:target { outline: 2px solid var(--accent); outline-offset: 2px; }
        .step-number { color: var(--accent); }
        .viewport { font-size: .85rem; }
        figure { margin-top: .8rem; }
        .image { position: relative; display: table; max-width: 100%; }
        img, video { display: block; max-width: 100%; height: auto; border-radius: .45rem; }
        .pin {
            position: absolute;
            display: grid;
            place-items: center;
            width: 1.65rem;
            height: 1.65rem;
            transform: translate(-50%, -50%);
            background: #154c3d;
            color: white;
            font-size: .9rem;
            font-weight: 750;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 1px 5px #0007;
        }
        figcaption { font-size: .9rem; margin-top: .4rem; }
        figcaption ol { margin: 0; padding-left: 1.4rem; }
        .capture { margin-bottom: .65rem; }
        .reviews { padding: 0; margin: 0; list-style: none; }
        .reviews li { margin-bottom: .45rem; }
        .reviews li:last-child { margin-bottom: 0; }
        .reviews span { margin-left: .5rem; }
        .coverage h3 { margin-top: .85rem; }
        .gaps { margin: .3rem 0 0; padding-left: 1.3rem; }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="context">UX validation · $section</p>
            <h1>$task</h1>
            <dl class="scope">
                <div><dt>Intended user</dt><dd>$user</dd></div>
                <div><dt>Target</dt><dd>$url</dd></div>
            </dl>
            <nav aria-label="Report sections">
                <a href="#findings">Findings</a>
                <a href="#walkthrough">Walkthrough</a>
                <a href="#coverage">Coverage</a>
            </nav>
        </header>
        <section class="card outcome $status" aria-label="Task outcome">
            <h2>Task outcome · $outcome</h2>
            <p>$observation</p>
            $takeaways
        </section>
        <section id="findings" aria-labelledby="findings-heading">
            <h2 id="findings-heading">Findings</h2>
            $findings
        </section>
        <section id="walkthrough" aria-labelledby="walkthrough-heading">
            <h2 id="walkthrough-heading">Walkthrough</h2>
            $steps
        </section>
        <section class="card coverage" id="coverage" aria-labelledby="coverage-heading">
            <h2 id="coverage-heading">Coverage</h2>
            $coverage
        </section>
    </main>
</body>
</html>
